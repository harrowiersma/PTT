# Shared defaults for every service.
#
# x-logging pins the json-file rotation as deployment metadata so a host
# rebuild (or a new operator) can't silently revert to unbounded logs —
# which is what took Murmur down for 4 days when the sip-bridge log hit
# 31 GB. Belt-and-suspenders alongside /etc/logrotate.d/docker-containers.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Health probes work off /proc/net/tcp for TCP-only services (avoids
# assuming curl/nc/pg_isready is in the image) and use HTTP for services
# that already expose one. All checks are cheap enough to run on 30 s.
# LISTEN state = "0A" in hex — filters out spurious TIME_WAIT entries.
#
# Ports in hex (needed for /proc/net/tcp match):
#   64738 = FCE2   (murmur)
#    8000 = 1F40   (admin)
#    5432 = 1538   (postgres)
#    5055 = 13BF   (traccar OsmAnd)
#    8082 = 1F92   (traccar http)
#      80 = 0050   (nginx)

services:
  murmur:
    image: mumblevoip/mumble-server:latest
    logging: *default-logging
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
      # Port 443 is now handled by Nginx SNI routing -> murmur:64738
      # Direct 64738 still available as fallback
    environment:
      # Pin the sqlite path explicitly. The mumble-server image's
      # generated ini has defaulted to /data/murmur.sqlite in some
      # versions and /data/mumble-server.sqlite in others — an image
      # refresh silently switched the path mid-deploy once and Mumble
      # started a fresh empty DB, losing the live channel tree. Pinning
      # here keeps the channels stable across future image bumps.
      MUMBLE_CONFIG_DATABASE: "/data/mumble-server.sqlite"
      MUMBLE_CONFIG_ICE: "tcp -h 0.0.0.0 -p 6502"
      MUMBLE_CONFIG_WELCOMETEXT: "<br/>Welcome to the openPTT TRX server.<br/>Use your PTT button to transmit."
      MUMBLE_CONFIG_BANDWIDTH: "24000"
      MUMBLE_CONFIG_USERS: "50"
      MUMBLE_CONFIG_OPUS_THRESHOLD: "0"
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"
    volumes:
      - murmur-data:/data
    healthcheck:
      test: ["CMD-SHELL", "awk '$$4 == \"0A\" && $$2 ~ /:FCE2$$/ {f=1} END {exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ptt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptt}
      POSTGRES_DB: ptt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptt -d ptt -h 127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    logging: *default-logging
    ports:
      - "5055:5055/tcp"
      - "5055:5055/udp"
    volumes:
      - traccar-data:/opt/traccar/data
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
    healthcheck:
      # Traccar exposes both :5055 (OsmAnd) and :8082 (HTTP). Check :5055
      # since it's the one the P50s actually POST GPS to.
      test: ["CMD-SHELL", "awk '$$4 == \"0A\" && $$2 ~ /:13BF$$/ {f=1} END {exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./server
      dockerfile: Dockerfile
    logging: *default-logging
    expose:
      - "8000"
    # Also publish admin on the host loopback so sip-bridge (which runs
    # in host network mode for correct SIP/RTP) can reach it. Nothing
    # external — 127.0.0.1 binding only.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Docker socket so admin can both `exec sqlite3` inside the murmur
      # container (to create channels / reset user registrations) and
      # `restart` it afterwards. Edits run as murmur's own user so file
      # perms line up without having to mount the data volume here.
      # See server/murmur/admin_sqlite.py.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Signed APK(s) served via the /apk/ route. Upload new builds to
      # the host path; read-only mount means a misbehaving admin can't
      # corrupt or overwrite the binary. See
      # server/config.py::provisioning_apk_path.
      - /var/openptt/apk:/var/openptt/apk:ro
    healthcheck:
      # /api/status/health is public and returns 200 whenever the admin
      # FastAPI process is answering. The keepalive task inside admin
      # covers the murmur-link half of the story; this check just needs
      # to know FastAPI itself hasn't wedged.
      test: ["CMD-SHELL", "awk '$$4 == \"0A\" && $$2 ~ /:1F40$$/ {f=1} END {exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      murmur:
        condition: service_healthy
    restart: unless-stopped

  sip-bridge:
    build:
      context: ./sip_bridge
      dockerfile: Dockerfile
    logging: *default-logging
    # Host networking so pjsua2 binds to the public IP directly and the
    # SDP c= line advertises the real address. Bridged Docker networking
    # breaks SIP/RTP because the SDP reports the container IP and DIDWW
    # sends media to an unreachable destination.
    network_mode: host
    # host-network mode + AppArmor docker-default enforce policy blocks
    # UDP sendto() from the container, causing pjsua2's REGISTER to fail
    # with err=120001 "Operation not permitted". Unconfine just this
    # service — it's isolated to SIP/RTP traffic only.
    security_opt:
      - apparmor:unconfined
    environment:
      ADMIN_INTERNAL_URL: "http://127.0.0.1:8000"
      PTT_INTERNAL_API_SECRET: "${PTT_INTERNAL_API_SECRET}"
      LOCAL_SIP_PORT: "5060"
      LOG_LEVEL: "${SIP_LOG_LEVEL:-INFO}"
      MUMBLE_HOST: "127.0.0.1"
      MUMBLE_PORT: "64738"
      # Downlink (Mumble → phone) volume. 0.5 = -6 dBFS; lower if phone
      # audio is hot, higher if too quiet. Applied per 20 ms frame on
      # the AudioSocket send path.
      DOWNLINK_GAIN: "${DOWNLINK_GAIN:-0.5}"
      # Concurrent call capacity. Each slot = one PTTPhone-N bot joined
      # to Phone/Call-N. Read both by the Python bridge and the Asterisk
      # dialplan (via ENV(PHONE_MAX_CALLS) in extensions.conf).
      PHONE_MAX_CALLS: "${PHONE_MAX_CALLS:-3}"
    # No healthcheck: host-network mode makes probing from inside the
    # container's own PID namespace at host-scoped :5060 unreliable and
    # a stuck asterisk process would still register at TCP level. If
    # SIP itself wedges we detect it via the admin-side call-flow
    # telemetry, not container health.
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-stream.conf:/etc/nginx/stream.d/ptt.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "awk '$$4 == \"0A\" && $$2 ~ /:0050$$/ {f=1} END {exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped

volumes:
  murmur-data:
  pgdata:
  traccar-data:
